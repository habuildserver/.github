name: Reusable - Development PR Comprehensive Checks

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version"
        required: false
        default: "22"
        type: string
      service-name:
        description: "Service name for Codecov flag"
        required: true
        type: string
      
      working-directory:
        description: "Folder of the service"
        required: false
        default: "."
        type: string

    secrets:
      SDK_TOKEN:
        required: true
      CODECOV_TOKEN:
        required: true
      COMMON_TOKEN:
        required: true

jobs:
  lint-test-coverage:
    name: ESLint, Format & Test Coverage Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      (github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base != null))
      || (github.event_name == 'push' && (github.ref_name == 'development' || github.ref_name == 'main'))
      || github.event_name == 'workflow_dispatch'

    concurrency:
      group: pr-checks-${{ github.repository }}-${{ inputs.service-name }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code (with submodules)
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.COMMON_TOKEN }}
          submodules: recursive
          fetch-depth: 0
      
      - name: Debug common folder
        run: ls -R src/app/common || echo "No common folder!"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Configure npm for private packages
        run: |
          echo "@habuildserver:registry=https://npm.pkg.github.com/" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.SDK_TOKEN }}" >> ~/.npmrc

      - name: Install dependencies
        run: npm ci

      - name: Check for package vulnerabilities
        id: audit
        run: |
          npm audit --audit-level=moderate
          echo "✅ Security audit passed"
        continue-on-error: true

      - name: Run linting on changed files
        if: github.event_name == 'pull_request'
        run: |
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACM origin/${{ github.base_ref }}...HEAD | grep -E '\.(js|jsx|ts|tsx)$' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "✅ No JavaScript/TypeScript files changed"
            exit 0
          fi

          echo "Linting changed files:"
          echo "$CHANGED_FILES"

          # Convert to absolute paths
          ABS_PATHS=$(echo "$CHANGED_FILES" | sed "s|^|${{ github.workspace }}/|")

          npx eslint $ABS_PATHS

      - name: Check code formatting on changed files
        if: github.event_name == 'pull_request'
        run: |
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACM origin/${{ github.base_ref }}...HEAD | grep -E '\.(js|jsx|ts|tsx)$' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "✅ No formattable files changed"
            exit 0
          fi

          echo "Checking formatting on changed files:"
          echo "$CHANGED_FILES"

          # Convert relative paths to absolute paths
          ABS_PATHS=$(echo "$CHANGED_FILES" | sed "s|^|${{ github.workspace }}/|")

          npx prettier --check $ABS_PATHS

          if [ $? -ne 0 ]; then
            echo "❌ Code is not properly formatted. Run 'npm run format' locally."
            exit 1
          else
            echo "✅ Code is properly formatted"
          fi

      - name: Run tests with coverage (PR)
        id: test-cov-pr
        run: npm run test:cov
        continue-on-error: false

      - name: Save branch coverage baseline
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: ${{ inputs.working-directory }}/coverage/coverage-summary.json
          key: coverage-baseline-${{ inputs.service-name }}-${{ github.ref_name }}-${{ github.sha }}

      - name: Save PR coverage report
        if: steps.test-cov-pr.outcome == 'success'
        run: mv coverage/coverage-summary.json pr-coverage-summary.json

      - name: Restore base branch coverage baseline
        id: base-cov
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: ${{ inputs.working-directory }}/coverage/coverage-summary.json
          key: coverage-baseline-${{ inputs.service-name }}-${{ github.base_ref }}-none
          restore-keys: coverage-baseline-${{ inputs.service-name }}-${{ github.base_ref }}-

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Parse Coverage Summaries
        id: coverage
        if: steps.test-cov-pr.outcome == 'success'
        env:
          BASE_KEY: ${{ steps.base-cov.outputs.cache-matched-key }}
        run: |
          THRESHOLD=80
          BASELINE_REF=""
          PR_SUMMARY_FILE="pr-coverage-summary.json"
          BASE_SUMMARY_FILE="coverage/coverage-summary.json"
          
          if [ ! -f "$PR_SUMMARY_FILE" ]; then
            echo "❌ PR Coverage summary file not found!"
            echo "status=fail" >> $GITHUB_OUTPUT
            echo "message=PR Coverage summary not found." >> $GITHUB_OUTPUT
            exit 1
          fi
          
          LINES_PCT=$(jq '.total.lines.pct' $PR_SUMMARY_FILE)
          STATEMENTS_PCT=$(jq '.total.statements.pct' $PR_SUMMARY_FILE)
          FUNCTIONS_PCT=$(jq '.total.functions.pct' $PR_SUMMARY_FILE)
          BRANCHES_PCT=$(jq '.total.branches.pct' $PR_SUMMARY_FILE)

          IS_BELOW_THRESHOLD=$(echo "$LINES_PCT < $THRESHOLD" | bc)
          
          if [ "$IS_BELOW_THRESHOLD" -eq 1 ]; then
            STATUS="⚠️ WARNING"
            MESSAGE="Total coverage is ${LINES_PCT}%. Threshold of ${THRESHOLD}% was not met."
            echo "status=warning" >> $GITHUB_OUTPUT
          else
            STATUS="✅ PASSED"
            MESSAGE="Total coverage is ${LINES_PCT}%. Threshold of ${THRESHOLD}% was met."
            echo "status=success" >> $GITHUB_OUTPUT
          fi
          
          COMPARISON_MESSAGE=""
          TABLE_BODY=""

          if [ -f "$BASE_SUMMARY_FILE" ]; then
            BASE_SHA="${BASE_KEY##*-}"
            BASELINE_REF=" @ \`${BASE_SHA:0:7}\`"
            BASE_LINES_PCT=$(jq '.total.lines.pct' $BASE_SUMMARY_FILE)
            BASE_STATEMENTS_PCT=$(jq '.total.statements.pct' $BASE_SUMMARY_FILE)
            BASE_FUNCTIONS_PCT=$(jq '.total.functions.pct' $BASE_SUMMARY_FILE)
            BASE_BRANCHES_PCT=$(jq '.total.branches.pct' $BASE_SUMMARY_FILE)
            
            WARNINGS=""

            IS_LINES_LESS=$(echo "$LINES_PCT < $BASE_LINES_PCT" | bc)
            if [ "$IS_LINES_LESS" -eq 1 ]; then
              WARNINGS+="* **Lines** dropped: ${LINES_PCT}% (was ${BASE_LINES_PCT}%)\n"
            fi

            IS_STMTS_LESS=$(echo "$STATEMENTS_PCT < $BASE_STATEMENTS_PCT" | bc)
            if [ "$IS_STMTS_LESS" -eq 1 ]; then
              WARNINGS+="* **Statements** dropped: ${STATEMENTS_PCT}% (was ${BASE_STATEMENTS_PCT}%)\n"
            fi

            IS_FUNCS_LESS=$(echo "$FUNCTIONS_PCT < $BASE_FUNCTIONS_PCT" | bc)
            if [ "$IS_FUNCS_LESS" -eq 1 ]; then
              WARNINGS+="* **Functions** dropped: ${FUNCTIONS_PCT}% (was ${BASE_FUNCTIONS_PCT}%)\n"
            fi

            IS_BRANCHES_LESS=$(echo "$BRANCHES_PCT < $BASE_BRANCHES_PCT" | bc)
            if [ "$IS_BRANCHES_LESS" -eq 1 ]; then
              WARNINGS+="* **Branches** dropped: ${BRANCHES_PCT}% (was ${BASE_BRANCHES_PCT}%)\n"
            fi
            
            if [ -z "$WARNINGS" ]; then
              COMPARISON_MESSAGE="✅ **Coverage met or exceeded base branch on all metrics.**"
            else
              printf -v COMPARISON_MESSAGE "⚠️ **Warning: Coverage dropped in the following areas:**\n%b" "$WARNINGS"
            fi

            TABLE_BODY="
            | Category | PR Percentage | Base Branch |
            | --- | ---: | ---: |
            | Lines | $LINES_PCT% | $BASE_LINES_PCT% |
            | Statements | $STATEMENTS_PCT% | $BASE_STATEMENTS_PCT% |
            | Functions | $FUNCTIONS_PCT% | $BASE_FUNCTIONS_PCT% |
            | Branches | $BRANCHES_PCT% | $BASE_BRANCHES_PCT% |
            "
            else
              COMPARISON_MESSAGE="ℹ️ *Base coverage report not found. Skipping comparison.*"
              TABLE_BODY="
              | Category | PR Percentage |
              | --- | ---: |
              | Lines | $LINES_PCT% |
              | Statements | $STATEMENTS_PCT% |
              | Functions | $FUNCTIONS_PCT% |
              | Branches | $BRANCHES_PCT% |
              "
          fi

          THRESHOLD_WARNING=""
          if [ "$IS_BELOW_THRESHOLD" -eq 1 ]; then
            THRESHOLD_WARNING="⚠️ **Please note:** The current coverage is below the ${THRESHOLD}% threshold. While this does not block the PR, it's recommended to improve test coverage before merging."
          fi
          
          COMMENT_BODY="---
          ### 📊 CI Coverage Report - **${{ inputs.service-name }}**
          **Status: $STATUS**
          _$MESSAGE_

          $THRESHOLD_WARNING

          **Comparison with \`${{ github.base_ref }}\`${BASELINE_REF}:**
          $COMPARISON_MESSAGE

          $TABLE_BODY

          ---
          *This is a CI-generated report for **${{ inputs.service-name }}** coverage.*"
          
          echo "$COMMENT_BODY" > ${{ github.workspace }}/comment-body.md
          echo "message=$MESSAGE" >> $GITHUB_OUTPUT

      - name: Post Coverage Comment to PR
        uses: actions/github-script@v8
        if: github.event_name == 'pull_request' && steps.test-cov-pr.outcome == 'success'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = `${process.env.GITHUB_WORKSPACE}/comment-body.md`;
            const commentBody = fs.readFileSync(path, 'utf8');
            const serviceName = '${{ inputs.service-name }}';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes('CI Coverage Report') &&
              comment.body.includes(`**${serviceName}**`)
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }

      - name: Warn if coverage threshold not met
        if: steps.coverage.outputs.status == 'warning'
        run: |
          echo "⚠️ WARNING: Coverage threshold not met."
          echo "${{ steps.coverage.outputs.message }}"
        continue-on-error: true

      - name: Write coverage to job summary
        if: steps.test-cov-pr.outcome == 'success'
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          jq -r --arg branch "$BRANCH" '
            "### 📊 Coverage - ${{ inputs.service-name }} (\($branch) @ ${{ github.event.pull_request.head.sha || github.sha }})",
            "| Category | Covered | Total | % |",
            "| --- | ---: | ---: | ---: |",
            (.total | to_entries[] | select(.key | IN("lines","statements","functions","branches"))
              | "| \(.key) | \(.value.covered) | \(.value.total) | \(.value.pct)% |")
          ' pr-coverage-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Configure AWS Credentials (OIDC)
        if: steps.test-cov-pr.outcome == 'success' && github.base_ref == 'main'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::963127282571:role/github-actions-oidc-role
          aws-region: ap-south-1
          # v6.3.0 defaults env-var->input translation ON; v4 had no such behaviour
          translate-env-variables: false

      - name: Upload coverage report to S3
        if: steps.test-cov-pr.outcome == 'success' && github.base_ref == 'main'
        run: |
          aws s3 cp pr-coverage-summary.json \
            s3://testing-automation-report-bucket/codecov/${{ inputs.service-name }}/coverage-summary.json \
            --region ap-south-1
