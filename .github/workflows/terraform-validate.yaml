name: Terraform Validation

on:
  workflow_call:

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.0

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6

      - name: Init TFLint
        run: tflint --init

      - name: Terraform Format Check
        id: fmt
        run: |
          echo "Checking Terraform formatting..."
          terraform fmt -check -recursive src/
        continue-on-error: true

      - name: Terraform Format Results
        if: steps.fmt.outcome == 'failure'
        run: |
          echo "Terraform formatting issues found!"
          echo "Run 'terraform fmt -recursive src/' to fix"
          exit 1

      - name: Validate Terraform
        working-directory: src
        run: |
          terraform init -backend=false
          terraform validate

      - name: Lint Terraform
        working-directory: src
        run: tflint --config="${GITHUB_WORKSPACE}/.tflint.hcl"

      - name: Terraform Tests
        working-directory: src
        run: |
          if ls tests/*.tftest.hcl 2>/dev/null || ls *.tftest.hcl 2>/dev/null; then
            terraform test
          else
            echo "No test files found, skipping"
          fi

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: src
          framework: terraform
          quiet: true
          config_file: .checkov.yml
